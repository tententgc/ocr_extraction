[project]
name = "docuflow"
version = "1.0.0"
description = "AI agent platform that turns unstructured documents into validated downstream records"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.60",
    "typhoon-ocr>=0.4.1",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# Local open-source Typhoon OCR 1.5 inference on Apple Silicon.
local = ["mlx-vlm>=0.6.8"]
# Claude as an OCR or agent backend. OpenAI, Typhoon and Ollama all speak the
# OpenAI protocol and need no extra package.
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "pytest-asyncio>=0.24"]

[project.scripts]
docuflow = "docuflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
